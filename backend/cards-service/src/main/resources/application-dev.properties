spring.datasource.url=jdbc:postgresql://postgres-primary:5432/cards_db
spring.datasource.username=${CARDS_DB_USERNAME}
spring.datasource.password=${CARDS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.grpc.server.port=9107

spring.grpc.client.channels.transfers.address=transfers-service:9104
spring.grpc.client.channels.kyc.address=kyc-service:9103
