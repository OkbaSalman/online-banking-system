spring.application.name=notifications-service
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

spring.kafka.bootstrap-servers=kafka:9093
spring.kafka.consumer.group-id=notifications-service

# Email (SMTP). Configure for your provider.
notifications.email.from=no-reply@banking.local

spring.main.keep-alive=true

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false