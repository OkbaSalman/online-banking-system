syntax = "proto3";

package kyc.v1;

option java_package = "com.banking.kyc.v1";
option java_multiple_files = true;

service KycService {
  rpc Ping(PingRequest) returns (PingResponse);

  rpc CreateDocumentSlot(CreateDocumentSlotRequest) returns (CreateDocumentSlotResponse);
  rpc ListMyDocuments(ListMyDocumentsRequest) returns (ListMyDocumentsResponse);
  rpc GetDocumentDownloadUrl(GetDocumentDownloadUrlRequest) returns (GetDocumentDownloadUrlResponse);

  rpc SubmitKyc(SubmitKycRequest) returns (SubmitKycResponse);
  rpc GetMyKyc(GetMyKycRequest) returns (GetMyKycResponse);

  rpc AdminListPending(AdminListPendingRequest) returns (AdminListPendingResponse);
  rpc AdminListApplications(AdminListApplicationsRequest) returns (AdminListApplicationsResponse);
  rpc AdminReview(AdminReviewRequest) returns (AdminReviewResponse);
  rpc AdminListDocumentsForApplication(AdminListDocumentsForApplicationRequest) returns (AdminListDocumentsForApplicationResponse);
  rpc AdminGetDocumentDownloadUrl(AdminGetDocumentDownloadUrlRequest) returns (AdminGetDocumentDownloadUrlResponse);
}

message PingRequest { string message = 1; }
message PingResponse { string message = 1; }

enum KycStatus {
  KYC_STATUS_UNSPECIFIED = 0;
  KYC_STATUS_NOT_SUBMITTED = 1;
  KYC_STATUS_PENDING = 2;
  KYC_STATUS_APPROVED = 3;
  KYC_STATUS_REJECTED = 4;
}

enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  DOCUMENT_TYPE_ID_FRONT = 1;
  DOCUMENT_TYPE_ID_BACK = 2;
  DOCUMENT_TYPE_PROOF_ADDRESS = 3;
  DOCUMENT_TYPE_SELFIE = 4;
}

message KycApplication {
  string id = 1;
  string user_id = 2;
  KycStatus status = 3;

  string full_name = 4;
  string national_id = 5;
  string address = 6;

  string reviewer_user_id = 7;
  string rejection_reason = 8;

  int64 created_at_epoch_ms = 9;
  int64 updated_at_epoch_ms = 10;
}

message KycDocument {
  string id = 1;
  string application_id = 2;
  string user_id = 3;
  DocumentType type = 4;
  string object_key = 5;
  string original_filename = 6;
  string content_type = 7;
  int64 size_bytes = 8;
  string sha256 = 9;
  int64 uploaded_at_epoch_ms = 10;
}

message CreateDocumentSlotRequest {
  DocumentType type = 1;
  string original_filename = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  string sha256 = 5;
}

message CreateDocumentSlotResponse {
  KycDocument document = 1;
  string upload_url = 2; // in our design: internal MinIO put URL
}

message ListMyDocumentsRequest {}
message ListMyDocumentsResponse {
  repeated KycDocument documents = 1;
}

message GetDocumentDownloadUrlRequest {
  string document_id = 1;
}
message GetDocumentDownloadUrlResponse {
  string download_url = 1;
}

message SubmitKycRequest {
  string full_name = 1;
  string national_id = 2;
  string address = 3;
  repeated string document_ids = 4;
}
message SubmitKycResponse {
  KycApplication application = 1;
}

message GetMyKycRequest {}
message GetMyKycResponse {
  KycApplication application = 1;
}

message AdminListPendingRequest {
  int32 limit = 1;
  int32 offset = 2;
}
message AdminListPendingResponse {
  repeated KycApplication applications = 1;
}

message AdminListApplicationsRequest {
  KycStatus status = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message AdminListApplicationsResponse {
  repeated KycApplication applications = 1;
}

message AdminReviewRequest {
  string application_id = 1;
  bool approve = 2;
  string rejection_reason = 3;
}
message AdminReviewResponse {
  KycApplication application = 1;
}

message AdminListDocumentsForApplicationRequest {
  string application_id = 1;
}
message AdminListDocumentsForApplicationResponse {
  repeated KycDocument documents = 1;
}

message AdminGetDocumentDownloadUrlRequest {
  string document_id = 1;
}
message AdminGetDocumentDownloadUrlResponse {
  string download_url = 1;
}