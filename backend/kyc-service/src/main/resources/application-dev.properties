spring.datasource.url=jdbc:postgresql://localhost:5542/kyc_db
spring.datasource.username=${KYC_DB_USERNAME}
spring.datasource.password=${KYC_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.grpc.server.port=9103

spring.grpc.client.channels.auth.address=localhost:9101


minio.endpoint=http://localhost:9000
minio.accessKey=${MINIO_ACCESSKEY}
minio.secretKey=${MINIO_SECRETKEY}
minio.bucket=kyc-documents

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer