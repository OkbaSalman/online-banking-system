spring.datasource.url=jdbc:postgresql://localhost:5542/transfers_db
spring.datasource.username=${TRANSFERS_DB_USERNAME}
spring.datasource.password=${TRANSFERS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.grpc.server.port=9104

spring.grpc.client.channels.ledger.address=localhost:9105
spring.grpc.client.channels.accounts.address=localhost:9102
spring.grpc.client.channels.kyc.address=localhost:9103

transfers.treasury-account-id=00000000-0000-0000-0000-000000000001
transfers.revenue-account-id=00000000-0000-0000-0000-000000000002

transfers.fee.bps=25
transfers.savings.max-debits-per-month=10

savings.interest.enabled=true
savings.interest.monthly-bps=50

# Override via env: AML_MAX_SINGLE_TRANSFER_CENTS, AML_VELOCITY_WINDOW_MS, AML_VELOCITY_MAX_COUNT
aml.max-single-transfer-cents=5000000
aml.velocity.window-ms=600000
aml.velocity.max-count=50