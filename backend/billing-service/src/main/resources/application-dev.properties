spring.datasource.url=jdbc:postgresql://postgres-primary:5432/billing_db
spring.datasource.username=${BILLING_DB_USERNAME}
spring.datasource.password=${BILLING_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.grpc.server.port=9106

spring.grpc.client.channels.transfers.address=transfers-service:9104
spring.grpc.client.channels.kyc.address=kyc-service:9103

billing.scheduler.enabled=true
billing.scheduler.poll-ms=10000
billing.scheduler.batch-size=25
billing.scheduler.catch-up=false
billing.scheduler.retry-ms=60000
